# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
app.frontend.url=http://localhost:5173

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
# Update these values with your local or remote database details
spring.datasource.url=jdbc:postgresql://localhost:5432/jobhub
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT AUTHENTICATION
# ===============================
# Replace this with a strong, random 256-bit secret key
app.jwt.secret=5c0b1512b656a894a21aa4c6642ab470c393727220f470238477592763f258ab
app.jwt.expirationInMs=86400000
app.jwt.RefreshExpirationInMs=604800000
app.jwt.verificationExpirationMs=900000
app.jwt.resetExpirationMs=900000
app.jwtExpirationInMs=86400000
app.jwtRefreshExpirationInMs=604800000

# ===============================
# EMAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# AWS S3 (FILE UPLOADS)
# ===============================
cloud.aws.credentials.access-key=YOUR_AWS_ACCESS_KEY
cloud.aws.credentials.secret-key=YOUR_AWS_SECRET_KEY
cloud.aws.region.static=us-east-1
app.awsServices.bucketName=jobhub-bucket

# ===============================
# OAUTH2 CLIENT CONFIGURATION
# ===============================
# Import local secrets (ignored by git)
spring.config.import=optional:classpath:application-secrets.properties

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
