# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=5000
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# CORS CONFIGURATION
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT AUTHENTICATION
# ===============================
app.jwt.secret=${JWT_SECRET:5c0b1512b656a894a21aa4c6642ab470c393727220f470238477592763f258ab}
app.jwt.expirationInMs=86400000
app.jwt.RefreshExpirationInMs=604800000
app.jwt.verificationExpirationMs=900000
app.jwt.resetExpirationMs=900000
app.jwtExpirationInMs=86400000
app.jwtRefreshExpirationInMs=604800000

# ===============================
# EMAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# AWS S3 (FILE UPLOADS)
# ===============================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:YOUR_AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:us-east-1}
app.awsServices.bucketName=${AWS_S3_BUCKET:jobhub-bucket}

# ===============================
